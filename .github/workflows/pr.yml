name: Pull Request
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
jobs:
  pr-title:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check PR Title
        uses: deepakputhraya/action-pr-title@v1.0.2
        with:
          allowed_prefixes: 'feat:,fix:,perf:,revert:,docs:,style:,refactor:,test:,build:,ci:,chore:'
          prefix_case_sensitive: true
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno lint
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno run -A --allow-scripts=npm:prisma,npm:@prisma/engines,npm:@prisma/client prisma generate --schema=./prisma/schema.prisma
      - run: deno install --allow-scripts=npm:prisma,npm:@prisma/engines,npm:@prisma/client
      - run: deno task typecheck
  test-semantic-release:
    uses: ./.github/workflows/semantic-release.yml
    permissions:
      contents: read
    with:
      dry_run: true
  build_docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Fork PRs get a read-only GITHUB_TOKEN and no secrets, so only same-repo
      # PRs can log in and push. Forks just build (validates the Dockerfile).
      - uses: docker/login-action@v4
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.github_token }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: build and push
        uses: docker/build-push-action@v7
        with:
          tags: ghcr.io/cbackas/tvbot:pr-${{github.event.pull_request.number}}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
