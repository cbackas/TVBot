name: Pull Request
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
jobs:
  pr-title:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check PR Title
        uses: deepakputhraya/action-pr-title@v1.0.2
        with:
          allowed_prefixes: 'feat:,fix:,perf:,revert:,docs:,style:,refactor:,test:,build:,ci:,chore:'
          prefix_case_sensitive: true
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno lint
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno run -A --allow-scripts=npm:prisma,npm:@prisma/engines,npm:@prisma/client prisma generate --schema=./prisma/schema.prisma
      - run: deno install --allow-scripts=npm:prisma,npm:@prisma/engines,npm:@prisma/client
      - run: deno task typecheck
  test-semantic-release:
    uses: ./.github/workflows/semantic-release.yml
    permissions:
      contents: read
    with:
      dry_run: true
  build_docker:
    name: build_docker (${{ matrix.arch }})
    # Build each arch on its native runner. QEMU-emulated arm64 SIGILLs on
    # Deno/V8 during `prisma generate`, so emulation is avoided entirely.
    # Validation only (no push), so forks and same-repo PRs behave identically.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=pr-${{ matrix.arch }}
          # Fork PRs can't write the Actions cache; only export it for same-repo PRs.
          cache-to: ${{ github.event.pull_request.head.repo.full_name == github.repository && format('type=gha,mode=max,scope=pr-{0}', matrix.arch) || '' }}
          push: false
